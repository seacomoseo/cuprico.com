      Ha atendido y respondido cada una de las dudas que le he planteado y ha ido más allá del encargo realizado.

      Rapidez desde el contacto a través del formulario hasta la visita. Eficacia y rapidez en la reparación.

      Precio acorde al trabajo realizado, pero es de esas veces que además estás contento con todo en general. Lo guardo como referencia, para quien me pregunte.
