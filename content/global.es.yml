    md: |
      Emitimos su CIE en {{ get location }}.

      Entrega en 24 h - 14 d (según inspección).

      [[::add:: Más información]](/boletin-electrico/ "Boletín Eléctrico y Certificados de Instalación Eléctrica (CIE)")

