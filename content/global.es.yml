  # Reseñas de placas solares y baterías (home y páginas solares)
  reviews:

  - title: Bogdan P.
    md: |
      Cúprico me instaló un sistema solar de 7,5 kW en el tejado de mi casa en Torre de la Horadada, en agosto de 2026.

      Me dieron información clara y una oferta según la configuración que pedí. Una vez acordadas las condiciones, la obra duró dos días y dejaron el tejado y la terraza limpios de escombros y materiales.

      El certificado de instalación llegó en una semana y la app del móvil funcionó desde el primer día. Un nivel de profesionalidad muy alto.
    rating: 5

  - title: Mariano B.
    md: |
      ¡Excelente servicio y rapidez insuperable! 100 % recomendables.

      De varias empresas que consulté, Cúprico fue la más rápida en enviarme el presupuesto para una batería Luna 2000. Lo mejor de todo es que solo dos días después de firmar el contrato ya la tenían instalada en casa.

      El trabajo fue impecable, muy profesional y limpio. Además, los operarios fueron súper educados y atentos. Da gusto contratar empresas tan eficientes y cuidadosas. ¡Un 10 de 10!
    rating: 5

  - title: Ludo V.
    md: |
      Muy satisfecho con Cúprico. Hemos ampliado nuestra instalación fotovoltaica (paneles adicionales más baterías) y el resultado ha superado nuestras expectativas: ahora somos casi totalmente autónomos.

      El equipo es muy profesional, atento y siempre disponible para explicar el funcionamiento de la instalación y resolver cualquier duda. El seguimiento post-instalación también es excelente. ¡Totalmente recomendable!
    rating: 5

  - title: Peter C.
    md: |
      Una experiencia fantástica con la instalación de placas solares en nuestra casa de Campoverde.

      Muy buen servicio y comunicación, y un trabajo muy profesional. Muy recomendable 👍
    rating: 5

  - title: Graeme W.
