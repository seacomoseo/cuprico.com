    md: |
      Montaje y legalización de Wall Connector en < 24 h.

      Realizamos tramitación de subvenciones si las hay.

      [[::add:: Más información]](/cargadores-ev/ "Venta e Instalación de Cargadores para Vehículos Eléctricos")

  - id: boletin-electrico-certificaciones
    url: '#boletin-electrico-certificaciones'
