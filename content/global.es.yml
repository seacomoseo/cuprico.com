services:
  title: Servicios
  sub: ¿Qué hacemos?

  modals:

  - id: instalacion-placas-solares
    url: '#instalacion-placas-solares'
    hanchor: Instalación de Placas Solares en {{ get location }}
    title: Instalación de Placas Solares
    sub: Fotovoltaicas
    img: /u/servicios/instalacion-placas-solares.jpg
    icon: solar_power
    md: |
      Estudio gratuito, ingeniería, instalación y subvenciones.

      Paneles premium y monitorización online.

      [[::add:: Más información]](/instaladores-placas-solares/ "Instaladores de Placas Solares Fotovoltaicas en San Pedro del Pinatar")

  - id: cargadores-ev
    url: '#cargadores-ev'
    hanchor: Cargadores EV en {{ get location }}
    title: Cargadores EV
    sub: Vehículos Eléctricos
    img: /u/servicios/cargadores-ev.jpg
    icon: ev_charger
    md: |
      Instalamos cargadores V2C en el día, desde 1.600 € IVA incluido.

      En la Región de Murcia te deduces hasta el 100 % en la renta.

      [[::add:: Más información]](/cargadores-ev/ "Instalación de Cargadores para Coche Eléctrico")

  - id: boletin-electrico-certificaciones
    url: '#boletin-electrico-certificaciones'
    hanchor: Boletín Eléctrico en {{ get location }}
    title: Boletín Eléctrico
    sub: y Certificaciones
    img: /u/servicios/boletin-electrico-certificaciones.jpg
    icon: task
    md: |
      Emitimos su CIE en {{% get location %}}.

      Entrega en 24 h - 14 d (según inspección).

      [[::add:: Más información]](/boletin-electrico/ "Boletín Eléctrico y Certificados de Instalación Eléctrica (CIE)")

  - id: instalaciones-electricas
    url: '#instalaciones-electricas'
    hanchor: Instalaciones Eléctricas en {{ get location }}
    title: Instalaciones Eléctricas
    sub: Residenciales y Comerciales
    img: /u/servicios/instalaciones-electricas.jpg
    icon: power
    md: |
      Diseñamos y ejecutamos cuadros, circuitos y alumbrado conforme al REBT.

      Coste cerrado, obra limpia y entrega de CIE al finalizar.

      ¡Solicite presupuesto sin coste!

  - id: reparaciones-electricas
    url: '#reparaciones-electricas'
    hanchor: Reparaciones Eléctricas en {{ get location }}
    title: Reparaciones Eléctricas
    img: /u/servicios/reparaciones-electricas.jpg
    icon: electrical_services
    md: |
      - Técnico puntual y repuesto a bordo
      - Luz restablecida en una sola visita

  solar_plates:
    title: Servicios
    sub: Paneles Solares
    md: |
      Pásese al **autoconsumo solar en {{% get location %}}** con nuestros instaladores de placas solares fotovoltaicas certificados.

      - Estudio de producción, orientación y sombras con SolarEdge Designer.
      - Gestión de subvenciones y compensación de excedentes (RD 244/2019).
      - Paneles premium Tier-1, inversores híbridos y monitorización en la nube.

      Reduzca hasta un **70 % su factura eléctrica** y gane independencia energética.

      Te damos 4 años de garantía en la mano de obra. Los materiales, según la garantía de cada fabricante.

      [[Contáctanos]](#contacto)

  chargers_ev:
    hanchor: Instalación de Cargadores para Coches Eléctricos
    title: Servicios
    sub: Instaladores oficiales V2C
    md: |
      Instalamos **puntos de recarga para coche eléctrico** en chalets, casas, garajes comunitarios y negocios.

      - Trabajamos con cargadores V2C Trydan y somos instaladores oficiales de la marca.
      - Si tienes placas solares, carga el coche con lo que te sobra.
      - Reparte la potencia con el resto de la casa para que no te salte la luz.
      - Lo instalamos en el día y te tramitamos el certificado.

      Desde **1.600 € IVA incluido**, con presupuesto cerrado en 24 h.

      **¿Vives en la Región de Murcia?** Mira cómo funciona la [deducción del 100 % en la renta](/cargador-coche-electrico-murcia/).

      [[Contáctanos]](#contacto)

  chargers_ev_murcia:
    hanchor: Instalación de Cargadores para Coche Eléctrico en el Mar Menor
    title: Servicios
    sub: Instaladores oficiales V2C
    md: |
      Instalamos el punto de recarga en chalets, casas y garajes comunitarios de San Pedro del Pinatar, Lo Pagán, San Javier, Santiago de la Ribera, La Manga, Los Alcázares y Torre-Pacheco.

      - Instalamos cargadores V2C Trydan y somos instaladores oficiales de la marca.
      - Si tienes placas solares, carga el coche con lo que te sobra.
      - Reparte la potencia con el resto de la casa para que no te salte la luz.
      - Lo instalamos en el día y te tramitamos el certificado.
      - Desde **1.600 € IVA incluido**, con presupuesto cerrado en 24 h.

      [[Pide presupuesto]](#contacto)

  chargers_ev_murcia_deduction:
    hanchor: Deducción del 100 % en el IRPF por instalar un punto de recarga en la Región de Murcia
    title: Hasta el 100 % en la renta
    sub: Deducción de la Región de Murcia
    md: |
      Si vives en la Región de Murcia, puedes deducirte en el IRPF el **100 % de lo que pagas por instalar el punto de recarga**, con un máximo de 4.000 €. Un cargador instalado con nosotros cuesta desde 1.600 € IVA incluido, así que en muchos casos lo recuperas entero.

      Requisitos:

      - Residencia fiscal en la Región de Murcia.
      - La casa o la plaza de garaje tienen que ser tuyas. Si vives de alquiler, no vale.
      - El coche, de uso particular.
      - Guardar la factura y mantener el cargador funcionando al menos 2 años.

      Se descuenta de la parte autonómica de tu IRPF. Si un año no te da para aplicarla entera, lo que sobra lo usas en los 3 años siguientes. Nosotros te damos la factura y el certificado. Lo demás lo ve tu gestoría.

      [[Pide presupuesto]](#contacto)

  bulletin:
    title: Servicios
    sub: Boletines y Certificados de Instalaciones Eléctricas
    md: |
      ¿Necesita un **boletín eléctrico en Murcia** para alta nueva, aumento de potencia o reforma?

      Somos **empresa instaladora autorizada** y emitimos el **Certificado de Instalación Eléctrica (CIE)** conforme al REBT en 24 h - 14 d, incluidos trámites ante la OCA.

      **¿Cuándo lo exige la ley?**

      - Obra nueva o vivienda con más de 20 años.
      - Cambio de actividad en local comercial.
      - Modificación > 50 % de la potencia contratada.

      Visitamos tu vivienda o negocio y realizamos las pruebas reglamentarias en la instalación para la posterior emisión del certificado sellado por industria de la comunidad autónoma.

      [[Contáctanos]](#contacto)


