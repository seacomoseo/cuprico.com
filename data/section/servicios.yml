name: Servicios
id: servicios
get:
- from: services.modals
  to: modals
remap:
- from: modals.*.url
boxes:
- get:
  - from: services.title
    to: title
  - from: services.sub
    to: sub
  - from: services.modals
    to: boxes
  remap:
  - from: boxes.*.id
  - from: boxes.*.hanchor
  - from: boxes.*.sub
  - from: boxes.*.img
  - from: boxes.*.md
  box:
    cols: 0
    cols_vs: 2
    gap_vs: 2
    gap_ny: 3
    hs: 5
    label: '{{ get others.see_more }}'
modal:
  color: white
  ratio: 16/9
  inset: true
  caps: true
  line: true
  size: xs
