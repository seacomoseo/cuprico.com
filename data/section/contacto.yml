  form:
    mail: administracion@cuprico.com
  inputs:
  - type: text
    name: Nombre
    label: '{{ get contact.name }}'
    req: y
  - type: phone
    name: Teléfono
    label: '{{ get contact.phone }}'
  - type: mail
    name: Email
    req: y
  - type: area
    name: Mensaje
    label: '{{ get contact.message }}'
    req: y
  get:
